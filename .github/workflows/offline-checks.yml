name: Offline checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  api-offline:
    name: API offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/requirements-dev.txt
      - name: Install API test dependencies
        run: python -m pip install --requirement requirements-dev.txt
        working-directory: apps/api
      - name: Run offline API checks
        run: python scripts/offline_checks.py
        working-directory: apps/api

  web-offline:
    name: Web static and offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web
      - name: Type-check
        run: npx --no-install tsc --noEmit --incremental false
        working-directory: apps/web
      - name: Lint
        run: npx --no-install eslint .
        working-directory: apps/web
      - name: Test rewrite proxy offline
        run: node --test tests/proxy-offline.test.cjs
        working-directory: apps/web
