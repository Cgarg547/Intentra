services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: intentra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: intentra
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - intentra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentra -d intentra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  intentra_pgdata:
